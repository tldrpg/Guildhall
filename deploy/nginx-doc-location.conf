# База знаний на longstoryshort.app/doc/
#
# Вставить в /etc/nginx/sites-available/longstoryshort.app, внутрь server-блока
# с SSL, перед `location / { ... }`.
#
# Почему `^~`, а не обычный префикс: в конфиге приложения есть regex-локации
# (`location ~* \.(?:html)$`, `location ~* \.(?:js|css)$`), а regex приоритетнее
# префиксных. Без `^~` они перехватят /doc/_astro/*.js, *.css и сами страницы
# и пойдут искать их в корне приложения — получим 404. Модификатор `^~` говорит
# nginx не проверять regex-локации после совпадения этого префикса.
#
# Почему `root`, а не `alias`: связка `alias` + `try_files` в nginx работает
# некорректно. При `root /var/www/lss-doc` запрос /doc/foo/ отображается
# в /var/www/lss-doc/doc/foo/ — поэтому сборка кладётся в подкаталог doc/.
#
# Почему отдельный каталог, а не /var/www/longstoryshort.app/doc: деплой
# приложения делает `rsync --delete` в свой корень и стирал бы доку при
# каждом релизе.
#
# ВАЖНО: перед выкладкой должен быть обновлён service worker приложения —
# см. deploy/README.md, раздел «Порядок переезда».

location ^~ /doc/ {
    root /var/www/lss-doc;

    include /etc/nginx/snippets/general-security-headers.conf;
    # Ставим ту же куку с гео, что и остальные html: её читает приложение,
    # а regex-локация на .html сюда больше не достаёт из-за `^~`.
    add_header Set-Cookie "geo=$geoip2_country_code; Path=/; Max-Age=86400; SameSite=Lax";
    add_header Cache-Control "public, max-age=0, must-revalidate";

    try_files $uri $uri/ $uri.html =404;
    error_page 404 /doc/404.html;

    # Ассеты Astro — с хешем в имени, кешируем навечно.
    location ^~ /doc/_astro/ {
        root /var/www/lss-doc;
        include /etc/nginx/snippets/general-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Индекс поиска Pagefind пересобирается на каждом релизе — кеш короткий.
    location ^~ /doc/pagefind/ {
        root /var/www/lss-doc;
        include /etc/nginx/snippets/general-security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
    }
}
