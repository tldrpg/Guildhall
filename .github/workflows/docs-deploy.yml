name: Docs CI/CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

# A newer push should win; half-finished deploys are not worth waiting for.
concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Build
        run: npm run build

      - name: Check internal links
        run: npm run check:links

      - name: Check structured data
        run: npm run check:jsonld

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          TARGET: ${{ vars.DOCS_WWW_PATH || '/var/www/lss-doc/doc' }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            /var/www/?*) ;;
            *) echo "Refusing to deploy to '$TARGET'"; exit 1 ;;
          esac
          test -d dist
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p $TARGET"
          rsync -ahW --no-compress --delete \
            -e "ssh -p $SSH_PORT" \
            "dist/" "$SSH_USER@$SSH_HOST:$TARGET/"
